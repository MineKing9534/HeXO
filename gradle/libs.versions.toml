[versions]
kotlin = "2.4.10"
kotlin-serialization = "1.11.0"
kotlin-coroutines = "1.11.0"
compose = "1.11.1"
kobweb = "0.25.0"

ksp = "2.3.11"

ktor = "3.5.2"
exposed = "1.4.0"

[libraries]
build-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "dev.detekt:dev.detekt.gradle.plugin", version = "2.0.0-alpha.6" }
testlogger-gradle-plugin = { module = "com.adarshr.test-logger:com.adarshr.test-logger.gradle.plugin", version = "4.0.0" }
node-gradle-plugin = { module = "com.github.node-gradle:gradle-node-plugin", version = "7.1.0" }

jna = { module = "net.java.dev.jna:jna", version = "5.19.1" }

kotlin-poet = { module = "com.squareup:kotlinpoet-ksp", version = "2.3.0" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

kotlin-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlin-serialization" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization" }
kotlin-serialization-properties = { module = "org.jetbrains.kotlinx:kotlinx-serialization-properties", version.ref = "kotlin-serialization" }
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }

cache = { module = "com.sksamuel.aedile:aedile-core", version = "3.0.4" }

ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-statusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-html = { module = "io.ktor:ktor-server-html-builder", version.ref = "ktor" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }

compose-html-core = { module = "org.jetbrains.compose.html:html-core", version.ref = "compose" }
compose-html-svg = { module = "org.jetbrains.compose.html:html-svg", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
kobweb-core = { module = "com.varabyte.kobweb:kobweb-core", version.ref = "kobweb" }
kobweb-worker = { module = "com.varabyte.kobweb:kobweb-worker", version.ref = "kobweb" }
kobwebx-serialization-kotlinx = { module = "com.varabyte.kobwebx:kobwebx-serialization-kotlinx", version.ref = "kobweb" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-migration = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
nanoid = { module = "io.viascom.nanoid:nanoid", version = "2.0.1" }

postgres = { module = "org.postgresql:postgresql", version = "42.7.12" }

jda = { module = "net.dv8tion:JDA", version = "6.5.0" }
jda-emoji = { module = "dev.freya02:jda-emojis", version = "4.3.0" }
dtk = { module = "de.mineking:DiscordToolKit", version = "1.6.2" }

svg = { module = "dev.jamesyox:svg4k", version = "0.1.0-alpha.3" }

logging = { module = "io.github.oshai:kotlin-logging", version = "8.0.4" }
logback = { module = "ch.qos.logback:logback-classic", version = "1.6.1" }

[bundles]
ktor-client = [ "ktor-client-core", "ktor-client-contentNegotiation", "ktor-serialization-json" ]
ktor-server = [ "ktor-server-core", "ktor-server-netty", "ktor-server-contentNegotiation", "ktor-server-statusPages", "ktor-serialization-json" ]

compose-html = [ "compose-runtime", "compose-html-core" ]

exposed = [ "exposed-core", "exposed-jdbc", "exposed-json", "exposed-datetime" ]

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version = "0.33.0" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

buildconfig = { id = "com.github.gmazzo.buildconfig", version = "6.0.10" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

kobweb-application = { id = "com.varabyte.kobweb.application", version.ref = "kobweb" }
kobweb-worker = { id = "com.varabyte.kobweb.worker", version.ref = "kobweb" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

dtk-localization = { id = "de.mineking.discord.localization", version = "1.2.1" }
