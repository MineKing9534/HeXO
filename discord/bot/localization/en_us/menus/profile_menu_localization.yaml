error:
  profile.not.found: |-
    ## Profile not found
    The queried profile with id **${id.value}** was not found!

menu.profile:
  view.label: View in Browser
  reload.label: Reload
  stats.content: !<profile:ProfileWithStatistics> |-
    **Member Since:** ${TimeFormat.DATE_SHORT.format(profile.registeredAt.toJavaInstant())}
    **ELO:** ${profile.statistics.rating.elo}${ profile.statistics.highestRating.elo.takeIf { it > profile.statistics.rating.elo }?.let { " (Highest $it)" } ?: "" }

    ### :seedling: Overall Games
    ${menu_profile_stats_game(locale, profile.statistics.totalGames)}

    ### :trophy: Ranked Games
    ${menu_profile_stats_game(locale, profile.statistics.ratedGames)}
    **Streak:** ${profile.statistics.ratedGames.currentWinStreak} (Longest ${profile.statistics.ratedGames.longestWinStreak})

  # Internal helper to avoid duplication
  stats.game: !<stats:ProfileGameStatistics> |-
    **Games Played:** ${stats.total}
    **Games Won:** ${stats.won}${
      if (stats.total == 0) ""
      else " (${(stats.winRate * 100).roundToInt()}%)"
    }
