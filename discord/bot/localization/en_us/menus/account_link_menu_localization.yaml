response:
  error:
    profile.not.found: >-
      ## Profile Not Found
      
      Profile with id **`${id.value}`** not found.

    profile.verify.failed: >-
      ## Verification Failed
      
      We couldn't verify that this HeXO profile belongs to you. Make sure the profile uses your Discord avatar, then try again. If it still fails, contact support.

    profile.link.failed: >-
      ## Profile Link Failed
      
      We couldn't link this profile. Your Discord account or the HeXO profile may already be linked elsewhere.

menu.link:
  link:
    label: Link Profile
    title: Connect your HeXO profile
    explanation.content: >-
      Connect your **[HeXO](https://hexo.did.science)** profile so the bot can use your rating and rank for Discord linked roles.
      Enter your profile **ID** or **URL** below. The bot will verify that the profile belongs to your Discord account.
      You can disconnect it at any time.
    inputs.url:
      label: Profile URL
      description: Your hexo.did.science profile ID or URL
      placeholder: https://hexo.did.science/profile/69bdd10f3a92bf78e1b6d7a0

  unlink:
    label: Disconnect
    title: Disconnect your HeXO profile
    inputs.confirm:
      label: Confirm Disconnect
      description: You can reconnect this profile later.
      options.value.label: Disconnect my HeXO profile

  auth:
    label: Authorize
    title: Authorize Discord linked roles
    description.content: !<url:String> |-
      Authorize HeXO to publish your rating and rank as Discord linked-role data. Discord will show the permission being requested before you approve it.
      
      **$url/linked-roles**
      
      You can revoke this access at any time from the `/link` menu.

  remove_auth:
    label: Revoke
    title: Revoke Discord authorization
    note.content: |-
      **Note:** Revoking authorization also removes HeXO from your user-installed Discord apps. If you use HeXO in servers where the bot is not installed, you will need to authorize the user app again.

    inputs.confirm:
      label: Confirm Revoke
      description: Stored Discord credentials will be deleted. You can authorize again later.
      options.value.label: Revoke Discord authorization


  title.content: '# :link: HeXO Connection Status'
  link_status.content: !<profile:Profile?> >-
    **HeXO profile:** ${
        profile?.let {
            "[${it.displayName}](${it.url})"
        } ?: "*Not connected*"
    }
  auth_status.content: !<isAuthenticated:Boolean> >-
    **Discord access:** ${
        if (isAuthenticated) "Authorized"
        else "Not authorized"
    }

  auth_explanation.content: >-
    :warning: Your HeXO profile is connected, but Discord access is not authorized. Authorize access so the bot can keep your linked-role rating and rank up to date.
