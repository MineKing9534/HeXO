error:
  match.not.found: |-
    ## Game not found
    The queried game with ID **${id.value}** was not found!

menu.game:
  title.content: !<game:FinishedGame> |-
    # ${
        when {
            game.tournament != null -> ":dart:"
            game.options.rated -> ":trophy:"
            else -> ":seedling:"
        }
    } Game Review
    ${ game.tournament?.let { 
      "-# Tournament: [${it.tournament.info.name}](${it.tournament.info.url})${if (it.matchInfo.bestOf > 1) ", G${it.matchInfo.currentGameNumber} (BO${it.matchInfo.bestOf})" else ""}"
    } ?: "" }

  view.label: View in Browser

finish.reason: >-
  ${
    when (reason) {
        is GameFinishReason.Regular -> "Six in a row"
        is GameFinishReason.Timeout -> "Timeout"
        is GameFinishReason.Surrender -> "Surrender"
        is GameFinishReason.Disconnect -> "Disconnect"
        is GameFinishReason.DrawAgreement -> "Draw"
        is GameFinishReason.Terminated -> "Terminated"
        is GameFinishReason.Aborted -> "Aborted by ${reason.abortingPlayer.displayName}"
    }
  }

time.control: >-
  ${
    when (control) {
        is TimeControl.Unlimited -> "Unlimited"
        is TimeControl.Match -> "Match ${control.mainTime} +${control.increment}"
        is TimeControl.Turn -> "Turn ${control.turnTime}"
    }
  }
