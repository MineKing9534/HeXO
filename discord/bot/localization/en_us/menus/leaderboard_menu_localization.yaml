menu.leaderboard:
  title.content: "# :trophy: HeXO Leaderboard"
  details.placeholder: View a player's profile
  player.details: >-
    **`${entry.totalGames.total}`** Played, 
    **`${entry.totalGames.won}`** Won${
      if (entry.totalGames.total == 0) ""
      else " (**`${(entry.totalGames.winRate * 100).roundToInt()}%`**)"
    }, 
    **`${entry.rating.elo}`** ELO
  reload.label: Reload
