command.theme:
  description: Configure your custom theme

menu.theme:
  header.content: '# Theme Configuration'

  select.label: Select
  delete:
    label: Delete
    title: Confirm Theme Deletion
    inputs:
      confirm:
        label: Confirm
        description: The custom theme will be permanently deleted
        options.value.label: !<name:String> I want to delete my theme '${name}'

  create:
    label: Create
    title: Create Custom Theme
    inputs:
      name:
        label: Name
        description: The name of the theme
        placeholder: My Theme

      base:
        label: Base Theme
        description: The theme to use as a base

  edit:
    label: Edit
    header.content: '# Theme Editor'
    back.label: Back
    property.placeholder: Customize a property

    color:
      title: !<property:String> Customize ${property}
      inputs:
        value:
          label: Color
          description: The HEX code of the color to use

    double:
      title: !<property:String> Customize ${property}
      inputs:
        value:
          label: Value
          description: The value to use

response.error:
  select: Failed to change theme
  delete: Failed to delete theme
  create: You already have a custom theme with name **${name}**!
  invalid.value: 'Invalid value for property **${property}**: ${message ?: "Unknown error"}'
